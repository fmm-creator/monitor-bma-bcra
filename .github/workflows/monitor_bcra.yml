name: Monitor BMA BCRA

on:
  schedule:
    # Corre cada 15 min entre las 16:00 y las 20:45 hora Argentina (19:00 a 23:45 UTC), de lunes a viernes
    - cron: '0,15,30,45 19-21 * * 1-5'
    - cron: '0 0 * * 2-6'
  workflow_dispatch: # Permite ejecutarlo manualmente cuando quieras

permissions:
  contents: write

jobs:
  actualizar-bma:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar paquetes de R (con caché automático)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::gt
            any::webshot2
            any::scales
            any::lubridate
            any::httr
            any::readxl
            any::tidyverse
            any::stringr
            any::readr

      - name: Ejecutar monitor y enviar alerta
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: Rscript generar_tabla_alerta.R

      - name: Guardar base CSV actualizada en el repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización BMA $(date +%Y-%m-%d)" && git push)
